services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: terrio-processes:0.1.0
    ports:
      - "${API_PORT:-5001}:8080"
    environment:
      PYGEOAPI_SERVER_URL: ${PYGEOAPI_SERVER_URL:-http://localhost:5001}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /venv/bin/python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8080/conformance', timeout=5)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
