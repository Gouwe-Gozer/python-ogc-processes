name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check src tests scripts

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Security lint
        run: uv run bandit -r src scripts -c pyproject.toml

      - name: Validate public API definition
        run: |
          uv run pygeoapi config validate \
            --config config/pygeoapi.yml
          uv run python -m terrio_processes.openapi \
            --config config/pygeoapi.yml \
            --output /tmp/public-openapi.yml
          uv run pygeoapi openapi validate \
            /tmp/public-openapi.yml

      - name: Validate integration API definition
        env:
          PYTHONPATH: ${{ github.workspace }}/tests/fixtures
        run: |
          uv run pygeoapi config validate \
            --config config/pygeoapi.integration.yml
          uv run pygeoapi openapi generate \
            --format yaml \
            --output-file /tmp/integration-openapi.yml \
            config/pygeoapi.integration.yml
          uv run pygeoapi openapi validate \
            /tmp/integration-openapi.yml

      - name: Test with coverage
        run: uv run pytest --cov=terrio_processes --cov-report=term-missing --cov-fail-under=70

  api-validation:
    name: API runtime and conformance
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Install Node.js for the Geonovum checker
        if: github.event_name != 'push'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm version with peer-resolution fix
        if: github.event_name != 'push'
        run: npm install --global npm@11.6.0

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose --file compose.release.yml config --quiet

      - name: Build and start self-contained API
        env:
          PYGEOAPI_SERVER_URL: http://127.0.0.1:5001
        run: docker compose --file compose.release.yml up --build --detach

      - name: Check API discovery resources
        run: uv run python scripts/smoke_discovery.py --base-url http://127.0.0.1:5001 --wait-seconds 60

      - name: Execute warp and validate all output modes
        run: uv run python scripts/smoke_warp.py --base-url http://127.0.0.1:5001 --save-reference /tmp/warp-reference.txt

      - name: Check reference downloads from a separate client container
        run: |
          docker run --rm --network host \
            --entrypoint /venv/bin/python3 \
            --mount type=bind,src="${{ github.workspace }}/scripts/smoke_warp.py",dst=/tmp/smoke_warp.py,readonly \
            terrio-processes:0.1.0 /tmp/smoke_warp.py --base-url http://127.0.0.1:5001

      - name: Verify results survive a service restart
        run: |
          docker compose --file compose.release.yml restart api
          uv run python scripts/smoke_discovery.py --base-url http://127.0.0.1:5001 --wait-seconds 60
          uv run python scripts/smoke_warp.py --check-saved-reference /tmp/warp-reference.txt

      - name: Check release-container isolation
        run: uv run python scripts/check_release_container.py

      - name: Compare Geonovum diagnostics with the reviewed baseline
        if: github.event_name != 'push'
        run: |
          uv run python scripts/check_geonovum_baseline.py \
            --raw-output /tmp/geonovum-checker.json

      - name: Upload Geonovum checker output after failure
        if: failure() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: geonovum-checker-output
          path: /tmp/geonovum-checker.json
          if-no-files-found: ignore

      - name: Upload npm debug logs after checker failure
        if: failure() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: npm-debug-logs
          path: /home/runner/.npm/_logs/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Show API logs after failure
        if: failure()
        run: docker compose --file compose.release.yml logs --no-color api

      - name: Stop API
        if: always()
        run: docker compose --file compose.release.yml down --volumes --remove-orphans
