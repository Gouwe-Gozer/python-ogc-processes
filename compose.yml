services:
  api:
    extends:
      file: compose.base.yml
      service: api
    ports:
    - ${API_PORT:-5001}:8080
    image: raster-processes-dev:0.1.0
    volumes:
    - ./config/pygeoapi.yml:/pygeoapi/local.config.yml:ro
    - ./src/geo_processes:/pygeoapi/geo_processes:ro
    pull_policy: build
  worker:
    extends:
      file: compose.base.yml
      service: worker
    image: raster-processes-dev:0.1.0
    volumes:
    - ./config/pygeoapi.yml:/pygeoapi/local.config.yml:ro
    - ./src/geo_processes:/pygeoapi/geo_processes:ro
  db:
    extends:
      file: compose.base.yml
      service: db
volumes:
  results: null
  jobs-db: null
