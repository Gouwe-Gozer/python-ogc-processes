services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: terrio-processes-dev:0.1.0
    pull_policy: build
    ports:
      - "${API_PORT:-5001}:8080"
    environment:
      PYGEOAPI_SERVER_URL: ${PYGEOAPI_SERVER_URL:-http://localhost:5001}
      TERRIO_OUTPUT_DIR: /var/lib/terrio/results
      TERRIO_RESULT_RETENTION_SECONDS: ${TERRIO_RESULT_RETENTION_SECONDS:-86400}
      TERRIO_RESULT_MAX_BYTES: ${TERRIO_RESULT_MAX_BYTES:-67108864}
      TERRIO_RESULT_MAX_COUNT: ${TERRIO_RESULT_MAX_COUNT:-256}
    volumes:
      - ./config/pygeoapi.yml:/pygeoapi/local.config.yml:ro
      - ./src/terrio_processes:/pygeoapi/terrio_processes:ro
      - results:/var/lib/terrio/results
    healthcheck:
      test:
        - CMD
        - /venv/bin/python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8080/conformance', timeout=5)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  results:
