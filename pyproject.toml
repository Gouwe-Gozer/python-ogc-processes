[project]
name = "geo-processes"
version = "0.1.0"
description = "An OGC API – Processes service for raster operations, powered by pygeoapi and rasterio/GDAL."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Minnert Wijnands (Gouwe-Gozer)" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pygeoapi==0.24.0",
    "numpy==1.26.4",
    "rasterio==1.4.3",
    "psycopg2-binary==2.9.11",
    "geoalchemy2==0.20.0",
    "sqlalchemy>=2,<3",
    "shapely==2.1.2",
    "pyproj==3.7.2",
    "requests==2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_processes", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import ordering
    "N",   # naming
    "SIM", # simplifications
    "UP",  # Python upgrades
]

[tool.bandit]
targets = ["src/geo_processes", "scripts"]
exclude_dirs = [".venv", "tests"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/fixtures"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["geo_processes"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4,<2",
    "jsonschema>=4.26,<5",
    "pre-commit>=4.5,<5",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.15.5,<0.16",
]
