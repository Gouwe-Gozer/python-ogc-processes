# Isolated combined-deployment validation; the runner supplies a unique project.
services:
  api:
    image: ${CITE_API_IMAGE:?set by the validation runner}
    environment: &runtime-environment
      PYGEOAPI_SERVER_URL: ${CITE_PUBLIC_URL:-http://api:8080}
      GEO_MANAGER_CLASS: geo_processes.async_manager.DurableProcessManager
    volumes:
    - ${CITE_RUN_DIR:?set by the validation runner}/api-config.yml:/pygeoapi/local.config.yml:ro
    - ./tests/fixtures/test_processes:/pygeoapi/test_processes:ro
    - ./scripts:/validation/scripts:ro
    - results:/var/lib/geo/results
    healthcheck:
      test:
      - CMD
      - /venv/bin/python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/conformance',
        timeout=5)
      interval: 2s
      timeout: 5s
      retries: 30
    extends:
      file: compose.base.yml
      service: api
    ports:
    - 127.0.0.1:${CITE_API_PORT:-0}:8080
  cite:
    image: ${CITE_IMAGE:?set by the validation runner}
    user: ${CITE_UID:-1000}:${CITE_GID:-1000}
    entrypoint:
    - java
    - -Xmx1024m
    - -Duser.home=/tmp
    - -cp
    - /usr/local/tomcat/webapps/teamengine/WEB-INF/classes:/usr/local/tomcat/webapps/teamengine/WEB-INF/lib/*:/usr/local/tomcat/lib/*
    - org.opengis.cite.ogcapiprocesses10.TestNGController
    command:
    - -o
    - /reports
    - /run/test-run-props.xml
    volumes:
    - ${CITE_RUN_DIR:?set by the validation runner}:/run:ro
    - ${CITE_RUN_DIR:?set by the validation runner}/reports:/reports
    depends_on:
      api:
        condition: service_healthy
  browser:
    image: ${CITE_IMAGE:?set by the validation runner}
    profiles:
    - browser
    ports:
    - 127.0.0.1::8080
    depends_on:
      api:
        condition: service_healthy
  worker:
    extends:
      file: compose.base.yml
      service: worker
    image: ${CITE_API_IMAGE:?set by the validation runner}
    environment: *runtime-environment
    volumes:
    - ${CITE_RUN_DIR:?set by the validation runner}/api-config.yml:/pygeoapi/local.config.yml:ro
    - ./tests/fixtures/test_processes:/pygeoapi/test_processes:ro
  db:
    extends:
      file: compose.base.yml
      service: db
volumes:
  results: null
  jobs-db: null
