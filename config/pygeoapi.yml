server:
  bind:
    host: 0.0.0.0
    port: 8080
  url: ${PYGEOAPI_SERVER_URL:-http://localhost:5001}
  logo: ${PYGEOAPI_SERVER_URL:-http://localhost:5001}/assets/GouweGozerLogo.svg
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  gzip: false
  language: en-US
  cors: true
  pretty_print: true
  admin: false
  limits:
    default_items: 10
    max_items: 50
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: '&copy; OpenStreetMap contributors'
  ogc_schemas_location: /schemas.opengis.net
  manager:
    name: ${GEO_MANAGER_CLASS:-geo_processes.async_manager.DurableProcessManager}
    # The default deployment supports both execution modes; compose.sync.yml is the opt-out.
    # File results use GEO_OUTPUT_DIR; durable request/response payloads use PostgreSQL.
    connection: ${GEO_JOB_DSN:-postgresql://geo:raster-local-only@db:5432/geo}
    output_dir: /tmp
logging:
  level: INFO
metadata:
  identification:
    title: Raster Processes API
    description: >-
      An OGC API – Processes service for raster operations, powered by pygeoapi and rasterio/GDAL.

      Designed around OGC API – Processes Part 1: Core, it exposes operations through
      standardized, discoverable endpoints, enabling clients to submit spatial
      data and retrieve processing results. The default deployment supports synchronous
      execution and durable asynchronous jobs using PostgreSQL and a separate worker.
      A lightweight synchronous-only deployment is available explicitly.

      Rasterio/GDAL powers five bounded raster operations: information,
      reprojection, point sampling, reclassification and polygonization.
      Submit GeoTIFFs through controlled public HTTPS references or inline
      base64. Results are JSON, GeoTIFF or GeoJSON, delivered by value or,
      where supported, through expiring download references.

      Intended alignment with the
      [OGC standard](https://docs.ogc.org/is/18-062r2/18-062r2.html)
      and passing regression tests do not establish formal OGC certification.
    keywords:
    - Rasterio
    - raster
    - GeoTIFF
    - OGC API Processes
    keywords_type: theme
    terms_of_service: ${PYGEOAPI_TERMS_OF_SERVICE:-https://opensource.org/license/mit}
    url: ${PYGEOAPI_SERVER_URL:-http://localhost:5001}
  license:
    name: MIT
    url: https://opensource.org/license/mit
  provider:
    name: Gouwe-Gozer
  contact:
    name: Gouwe-Gozer
    role: pointOfContact
resources:
  sample-points:
    type: collection
    title: Sample points
    description: Three WGS84 sample points within the supplied AHN4 raster near Alkmaar.
    keywords: [sample, points, AHN4]
    extents:
      spatial:
        bbox: [4.827911, 52.644807, 4.836065, 52.647618]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    links:
      - rel: related
        type: image/tiff
        title: Matching AHN4 sample GeoTIFF
        href: ${PYGEOAPI_SERVER_URL:-http://localhost:5001}/sample-data/AHN4_R5_117000_517000.TIF
    providers:
      - type: feature
        name: GeoJSON
        data: ${GEO_SAMPLE_DATA_DIR:-src/geo_processes/data/samples}/points.geojson
        id_field: id
        editable: false
  sample-polygons:
    type: collection
    title: Sample polygon
    description: A small polygon around the sample points, contained within the supplied AHN4 raster footprint.
    keywords: [sample, polygon, AHN4]
    extents:
      spatial:
        bbox: [4.82728482, 52.64441446, 4.83669559, 52.64798021]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    links:
      - rel: related
        type: image/tiff
        title: Matching AHN4 sample GeoTIFF
        href: ${PYGEOAPI_SERVER_URL:-http://localhost:5001}/sample-data/AHN4_R5_117000_517000.TIF
    providers:
      - type: feature
        name: GeoJSON
        data: ${GEO_SAMPLE_DATA_DIR:-src/geo_processes/data/samples}/polygons.geojson
        id_field: id
        editable: false
  raster-info:
    type: process
    processor:
      name: geo_processes.processes.info.RasterInfoProcessor
  raster-warp:
    type: process
    processor:
      name: geo_processes.processes.warp.RasterWarpProcessor
  raster-sample-points:
    type: process
    processor:
      name: geo_processes.processes.sample.RasterSamplePointsProcessor
  raster-reclassify:
    type: process
    processor:
      name: geo_processes.processes.reclassify.RasterReclassifyProcessor
  raster-polygonize:
    type: process
    processor:
      name: geo_processes.processes.polygonize.RasterPolygonizeProcessor
