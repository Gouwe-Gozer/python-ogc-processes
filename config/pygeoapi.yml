server:
  bind:
    host: 0.0.0.0
    port: 8080
  url: ${PYGEOAPI_SERVER_URL:-http://localhost:5001}
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  gzip: false
  language: en-US
  cors: true
  pretty_print: true
  admin: false
  limits:
    default_items: 10
    max_items: 50
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: '&copy; OpenStreetMap contributors'
  ogc_schemas_location: /schemas.opengis.net
  manager:
    name: terrio_processes.manager.OgcSynchronousManager
    connection: unused
    output_dir: /tmp
logging:
  level: INFO
metadata:
  identification:
    title: Terrio Processes API
    description: Bounded synchronous raster information and reprojection powered by Terrio.
    keywords:
    - Terrio
    - raster
    - GeoTIFF
    - OGC API Processes
    keywords_type: theme
    terms_of_service: ${PYGEOAPI_TERMS_OF_SERVICE:-https://opensource.org/license/mit}
    url: ${PYGEOAPI_SERVER_URL:-http://localhost:5001}
  license:
    name: MIT
    url: https://opensource.org/license/mit
  provider:
    name: Gouwe-Gozer
  contact:
    name: Gouwe-Gozer
    role: pointOfContact
resources:
  terrio-info:
    type: process
    processor:
      name: terrio_processes.processes.info.TerrioInfoProcessor
  terrio-warp:
    type: process
    processor:
      name: terrio_processes.processes.warp.TerrioWarpProcessor
